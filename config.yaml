# Single source of truth for every seed, path and model parameter.
# No numeric constant may be hardcoded in Python — see CLAUDE.md "Reproducibility".
#
# All model values below are transcribed from Renart et al. 2010 (see docs/paper/).
# Provenance is given per block so any value can be traced back to the SOM.

seed: 1234                     # sets random, numpy and framework RNGs at script startup

paths:
  raw: data/raw                # READ-ONLY. never written to.
  processed: data/processed
  artifacts: artifacts         # metrics, logs, figures, checkpoints

logging:
  metrics_file: artifacts/metrics.jsonl
  log_file: artifacts/run.log
  log_every_n_iterations: 1    # loss + NaN check logged every iteration

# ---------------------------------------------------------------------------
# Block 1 — feedforward postsynaptic pair (Fig. 1)
# Provenance: SOM S-p.19-20. See docs/paper/01-postsynaptic-pair.md
# ---------------------------------------------------------------------------
pair_model:
  neuron:                      # current-based LIF, V relative to rest (rest = 0)
    tau_m_ms: 10.0
    v_threshold_mV: 20.0
    v_reset_mV: 10.0
    t_refractory_ms: 2.0
  synapse:
    tau_s_ms: 5.0              # PSC decay (kick + exponential)
    epsp_peak_mV: 0.75         # defines J_E by numerical calibration
    ipsp_peak_mV: -0.75        # defines J_I by numerical calibration
  inputs:
    n_excitatory: 250
    n_inhibitory: 220          # E+I condition only
    rate_shared_sweep_hz: 5.0  # Fig. 1B
    rate_correlated_sweep_hz: 20.0   # Fig. 1C,E-F E+I condition, the paper's STATED value.
      # UNUSED for Fig. 1E as of 2026-09-30 -- see rate_e_plus_i_calibrated_hz below. Kept
      # because it is what the paper says, so the discrepancy stays visible.
    rate_e_plus_i_calibrated_hz: 15.625  # DERIVED 2026-10-01 by bisection
      # (block1.calibrate_rate e_plus_i, settings in pair_model.calibration_rate below:
      # 5 trials x 120 s per candidate, tolerance 0.18 Hz against a 0.09 Hz standard error).
      # Resolves ambiguity 3 (found 2026-09-30): the SOM states "The
      # input firing rate was set to 20 spikes/s TO PRODUCE AN OUTPUT RATE OF 5 spikes/s
      # when r_in = 0", but 20 spikes/s measured 12.05 +- 2.57 Hz out with these
      # parameters. PSP calibration, analytic mean drive and free-membrane statistics each
      # check out independently, so the paper's two numbers are mutually inconsistent here.
      # Researcher's call: honour the stated OUTPUT rate and recalibrate the input, so both
      # Fig. 1E curves share an operating point ("identical statistics", per the caption).
      # block1.full_pass raises rather than run while this is null.
      #
      # Re-derive this whenever n_excitatory, n_inhibitory, tau_m_ms, the PSP amplitudes or
      # the threshold change -- like the E-only rate below, it is a property of the whole
      # operating point, not a free parameter.
    rate_e_only_calibrated_hz: 4.04297   # Fig. 1E E-only curve -- resolves ambiguity 1
      # (docs/paper/01-postsynaptic-pair.md): the paper's 20Hz is E+I-only; the E-only rate
      # isn't stated, so it's calibrated by bisection (block1.calibrate_rate) to give 5Hz
      # output at r_in=0, averaging n_trials=5 independent replicates per candidate rate
      # (a code-review fix: the original single-sample-per-step version could violate
      # bisection's monotonicity assumption under simulation noise). Re-derived 2026-09-10
      # at L=20,000ms (a longer one-time calibration run, not the fast-exploratory sweep
      # scale); superseded an earlier single-sample value of 4.0708 (0.7% higher, within
      # noise but less reliably derived). PROGRESS.md records the derivation.
    mother_train:
      jitter_tau_ms: 5.0       # two-tailed exponential, zero mean
  sweeps:
    shared_fraction_p: [0.0, 0.4]    # Fig. 1B range
    shared_fraction_grid: [0.0, 0.1, 0.2, 0.3, 0.4]  # actual p sweep points (Fig. 1B, full pass)
    p_fixed: 0.2                     # Fig. 1C,E-F
    r_in: [0.0, 0.4]                 # Fig. 1E range
    r_in_grid: [0.0, 0.01, 0.025, 0.05, 0.1, 0.2, 0.3, 0.4]
      # Fig. 1E's sweep points. Extended 2026-09-30 from a grid that stopped at 0.1 and so
      # covered only a quarter of the published x-axis, which the `r_in` range above has
      # always recorded as (0, 0.4). Spacing stays denser at the low end, where the E-only
      # curve rises steeply and the E-vs-E+I contrast is decided; 0.025 is kept because it
      # is the example point Figs. 1C and 1F are drawn at.
      #
      # Cost: block1.full_pass batches every sweep point into ONE Brian2 NeuronGroup per
      # time chunk, so this widens that group from 15 points to 21 (5 p-points + 8 r_in
      # points per condition, 2 conditions) -- about 1.4x the per-timestep width, not 1.4x
      # the run. Simulated duration (`simulation.length_s`) remains the dominant cost.
    r_in_fig1f_example: 0.025        # blue circle of Fig. 1E; Fig. 1F's traces use this point
  simulation:
    dt_ms: 0.05
    length_s: 10000.0
    chunk_duration_s: 200.0  # block1.full_pass: bounded per-chunk window for the paper-
      # accurate full pass (both input generation and simulation are chunked at this scale
      # -- see PROGRESS.md). block1.batched_model batches all 15 sweep points into one
      # simulation, so per-chunk arrays are 15x wider than the original per-point design
      # this value was first set for.
      #
      # MEMORY/RUNTIME TRADE ONLY -- chunking is mathematically exact (the correlations are
      # accumulated by analysis.StreamingCorrelation), so this never affects a result. Size
      # it to the machine: per-chunk arrays are roughly
      # chunk_s * 1000/dt_ms * n_points * 3 * 8 bytes, i.e. ~6.7GB at 500s and 21 points,
      # which fits the DGX's 121GB but not a 30GB workstation. Lowered to 200s (~2.7GB) on
      # 2026-10-01 when the grid widened from 15 points to 21 and the run moved local.
      # Raise it again on the DGX if the per-chunk overhead starts to matter.
  calibration_rate:             # bisection settings for block1.calibrate_rate. NOT paper
    # values -- search parameters for resolving the two input-rate ambiguities. Sized from
    # a measurement, not guessed: an output-rate estimate is a noisy Monte Carlo quantity,
    # so the tolerance MUST sit above its standard error or bisection makes its bracket
    # decisions on noise and "converges" at a random point inside it.
    #
    # Measured 2026-10-01 at the E+I operating point: output ~5 Hz is reached near 15.3 Hz
    # input, with a local slope of 0.92 Hz-out per Hz-in, so input uncertainty is about
    # 1.1x the output tolerance. SE of the mean scales as sqrt(target / (duration*n_trials)),
    # giving SE ~= 0.09 Hz at the values below -- half the tolerance, as it should be.
    # An earlier version of this stanza used duration 20 s and tolerance 0.05 Hz, where the
    # SE was 5.1x the tolerance; that would not have converged honestly.
    duration_ms: 120000.0       # per trial; ~600 spikes at a 5 Hz output
    rate_low_hz: 10.0           # bracket, from the scan above: 10 Hz in -> 0.84 Hz out,
    rate_high_hz: 25.0          # 25 Hz in -> well above 5. Must straddle the target.
    tolerance_hz: 0.18          # ~2x the SE; corresponds to ~0.2 Hz of input precision
    max_iterations: 40          # the bracket needs only ~7 halvings to reach 0.2 Hz
    n_trials: 5                 # independent replicates averaged per candidate rate
  calibration_check:            # single-spike PSP verification harness (Phase 1 self-check),
    dt_ms: 0.01                 # distinct from the production sweep's dt/length above --
    duration_ms: 50.0           # this only needs to resolve one ~7ms-peaked PSP cleanly

# ---------------------------------------------------------------------------
# Block 2 — recurrent binary network (Fig. 2)
# Provenance: SOM S-p.18-19. See docs/paper/02-binary-network.md
# ---------------------------------------------------------------------------
binary_network:
  connection_probability: 0.2  # p_ab, all population pairs
  m_x: 0.1                     # external population mean activity
  theta: 1.0                   # firing threshold, all cells
  couplings:                   # j_ab, scaled by 1/sqrt(N) at build time (post <- pre)
    j_EE: 5.0
    j_EI: -10.0
    j_IE: 5.0
    j_II: -9.0
    j_EX: 5.0
    j_IX: 4.0
  tau_ms: 10.0                 # tau_E = tau_I = tau_X; dt = tau / (3N)
  sampling_rate_instantaneous: 1   # SR for r/c (Fig. 2C, 2G): 1 sample per tau
  sampling_rate_lagged: 16         # SR for CCGs (Fig. 2E): 16 samples per tau
  sizes_fixed: [1024, 8192]    # required exactly, not swept: Fig. 2D uses both; 2E/2G use 8192
  full_pass:                   # Fig. 2C's N-grid + per-size repeat count (session
    # 2026-09-11/12): decided against the JIT+manual-loop throughput benchmark
    # (N=1024: 612,850 ticks/s; N=8192: 83,433 ticks/s -- close to O(N^2) per-realisation
    # cost), targeting <24h wall-clock on spark-c3d8's 20 Slurm cores. Repeats taper at
    # the top of the range since cost is dominated there; paper's 50 kept everywhere it's
    # cheap. Runs as independent single-process Slurm array tasks (block2.full_pass),
    # not Python multiprocessing -- see docs/adr/0003's ARM64 ProcessPoolExecutor note.
    sizes:   [100, 178, 316, 562, 1000, 1780, 3160, 5620, 8192]
    repeats: [50,  50,  50,  50,  50,   50,   25,   12,   10]
    length_tau: 200000
  fig2g_subsample_neurons: 1000  # random E-neuron subset at N=8192 for the r histogram (~500k pairs)
  ccg:
    max_lag_ms: 50.0            # lag range COMPUTED; bin = tau_ms / sampling_rate_lagged
      # (native, no downsampling)
    display_lag_ms: 10.0        # lag range PLOTTED. Read off the published Fig. 2E, whose
      # x-axis spans about -10 to +10 ms. Computing wider costs nothing and lets the tails
      # be inspected; the panel is drawn to the paper's range.
  burn_in_tau: 10               # discarded before recording (session 2026-09-11: random
    # Bernoulli(0.5) initial state per neuron, then burn_in_tau*3N ticks discarded)
  exploratory:                  # session 2026-09-11 grilling Q11: fast validation pass,
    sizes: [100, 200, 400]      # not reproduction numbers -- checked against S-Eq(18,28-33)
    n_realisations: 5           # closed-form predictions, and used for the Q13 throughput benchmark
    length_tau: 5000
  simulation:
    length_tau: 200000
    n_realisations: 50         # Fig. 2C's stated repeat count (SOM S-p.18).
      # Fig. 2F is NOT reproduced: the published panel is a three-arrow cycle diagram
      # ("Description of the asynchronous self-consistent solution"), with no curves in it.
      # The SOM does say "Each dot (curve) in Fig. 2C (2F) is the average over 50 (10)
      # simulations", so the two sources disagree -- most likely a leftover from a draft
      # where panel F was plotted. Documented in docs/paper/06-figure-protocols.md rather
      # than silently resolved either way.
  robustness:                  # Fig. S4 sweep
    lambda_E: [1.0, 2.0]       # scales j_EE and j_IE together
    tau_I: [1.0, 2.0]          # relative to tau_E = 1
  illustrative_panels:          # single-realisation runs for 2B/2D/2E/2G -- deliberately
    # short (not the full 200,000 tau) since these show qualitative shape, not ensemble
    # precision (2C's job already covers that); cheap enough to run locally, no DGX needed.
    panel_b_window_tau: 100      # ~1s at SR=16, one E-cell's current components
    panel_d_window_tau: 200      # ~2s at SR=16, population-mean activity (both fixed sizes)
    panel_e_window_tau: 2000     # SR=16 current-component CCGs
    panel_g_window_tau: 20000    # SR=1, 1000-neuron subsample for the r histogram

# ---------------------------------------------------------------------------
# Block 3 — recurrent conductance-based spiking network (Fig. 3)  [MAIN FOCUS]
# Provenance: SOM S-p.20-21. See docs/paper/03-recurrent-spiking-network.md
# ---------------------------------------------------------------------------
spiking_network:
  populations:
    n_excitatory: 4000
    n_inhibitory: 1000
    n_external: 4000
  connection_probability: 0.2
  neuron:
    c_m_nF: 0.25
    g_L_nS: 16.7               # tau_m = C_m/g_L = 15 ms
    v_leak_mV: -70.0
    v_threshold_mV: -50.0
    v_reset_mV: -60.0
    t_refractory_excitatory_ms: 2.0
    t_refractory_inhibitory_ms: 1.0
  reversal_potentials_mV:
    excitatory: 0.0            # V_rev^E = V_rev^X
    inhibitory: -80.0
  conductances_nS:             # mean g^ab (post <- pre)
    g_EE: 2.4
    g_EI: 40.0
    g_IE: 4.8
    g_II: 40.0
    g_EX: 5.4
    g_IX: 5.4
    heterogeneity_std_fraction: 0.5   # g ~ Gaussian(mean, 0.5*mean); see ADR on negative samples
  synapse:                     # difference of exponentials
    tau_rise_ms: 1.0
    tau_decay_ms: 5.0
    tau_normalisation_ms: 1.0  # tau-tilde: keeps unitary conductance area constant
  delays_ms:                   # uniform, sampled at 0.05 ms resolution
    from_excitatory: [0.5, 1.5]
    from_inhibitory: [0.1, 0.9]
  external_input:
    kind: poisson
    rate_hz: 2.5
  burn_in_ms: 100.0             # discarded before recording -- paper doesn't state one
    # (docs/paper/03 Ambiguity); ~7x tau_m=15ms, long enough for the initial transient
    # to settle. Revisit with real numbers before the Fig. 3A-B full pass.
  simulation:
    integrator: rk2            # second-order Runge-Kutta
    dt_ms: 0.05
    length_s: 200.0            # 5000 s for the Fig. S6 characterisation run
    n_networks: 10
  panels:                       # Fig. 3A/3B's single-network run (block3.panels)
    length_s: 1000.0            # DELIBERATE DEVIATION from the paper, decided 2026-10-01.
      # Fig. S6 states 5000 s for the single-network protocol ("All data comes from a single
      # network simulated for 5000 s. All parameters as in Fig. 3 of the main text");
      # Fig. 3's own caption states no length. 5000 s is not reachable here: at the measured
      # 27.1 h per 200 s on this node it is ~677 h (~28 days) uncheckpointed, with a 40GB
      # rate matrix. 1000 s costs ~135 h and 8GB.
      #
      # What it costs scientifically, measured not guessed. Fig. 3B's claim is that the
      # measured histogram is wide RELATIVE to its jittered null, and the null's width is
      # pure estimator noise -- sigma_r for independent 1 Hz trains at T=50 ms is
      #     200 s -> 0.0114     1000 s -> 0.0056     5000 s -> 0.0027
      # on an axis spanning +-0.05. At 200 s the null is as wide as the measurement and the
      # panel says nothing; at 1000 s it is half that, so the comparison is real but the
      # separation is visibly weaker than the published figure's. r_bar itself averages over
      # ~500k pairs and is unaffected at any of these lengths; only sigma_r is.
      #
      # Raise this to 5000 and the guard below will refuse -- by design. See GitHub #8.
    max_rate_matrix_gb: 10.0    # NOT a paper value -- a guard, sized against panels.slurm's
      # --mem. eval.pairwise_correlations stacks an (r_bar_sample_size, n_windows) float64
      # matrix, n*(length_s*1000 - burn_in_ms)/bin_dt_ms*8 bytes: 1.6GB at 200 s, 8GB at
      # 1000 s, 40GB at 5000 s, and numpy.corrcoef adds a centred copy on top. panels.py
      # checks this BEFORE building the network, because the failure would otherwise land
      # after a multi-day run with nothing written.
  r_bar_sample_size: 1000       # session 2026-09-16/17 grilling: r_bar estimated over all
    # pairs among this many randomly-sampled E neurons, mirroring Fig. S6's own "1000 E and
    # 1000 I cells" convention -- not all N_E pairs (~8M, too many) and not an ad hoc sample.
  exploratory:                 # session 2026-09-14 grilling Q1: smoke-test pass, full
    # paper-scale N (unlike block 2 -- g^ab are fixed nS, not 1/sqrt(N)-scaled, so
    # shrinking N would starve every neuron of input and land in a different regime).
    # Only length_s is shortened relative to `simulation` above; everything else is
    # identical, so this run is a true subset of the eventual full pass.
    length_s: 5.0
    n_networks: 1
    brian2_device: runtime      # standalone deferred until a measured need (ADR 0001/0003 pattern)
  fig3a:                        # Fig. 3A caption (main text p.590)
    raster_neurons: 500         # "Raster (top) of 500 E (green) and I (red) neurons
      # sorted by rate". AMBIGUITY: the caption does not say whether this is 500 total
      # or 500 of each. Read here as 500 TOTAL, sampled from E and I in proportion to
      # their population sizes (so 400 E / 100 I at the paper's 4:1 ratio).
    tracking_bin_ms: 3.0        # "transformed to z scores, bin size 3 ms"
  fig3b:                        # Fig. 3B caption + Fig. S6
    jitter_ms: 500.0            # "jitter +/- 500 ms"; Fig. S6 states the distribution:
      # "uniform random shift in [-0.5, +0.5] s per spike". Count window T comes from
      # analysis.count_window_T_ms (50 ms), which the caption also states.
    n_surrogate_sets: 1         # the grey histogram is one jittered surrogate of the
      # same pairs as the black one -- not the N_jitt=500 SIGNIFICANCE test of S-Eq(41),
      # which is a different procedure applied to in vivo data.
  fig3cd:                       # SOM S-p.21, the intracellular cancellation experiment
    i_app_nA: [-1.3, -0.65, -0.1, 0.0, 0.2, 0.74, 1.48, 3.7]
      # VERBATIM from S-p.21: "The current levels were Iapp = -1.3, -0.65, . . . , -0.1,
      # 0, 0.2, 0.74, 1.48, . . . 3.7 nA". The two "..." gaps are NOT stated anywhere in
      # the paper or the SOM, and the printed values fit neither an arithmetic nor a
      # geometric series, so they cannot be reconstructed. Only the eight explicitly
      # printed levels are listed here. UNRESOLVED -- see src/block3/README.md.
    length_s: 50.0              # "50 s of simulated time"
    n_networks: 10              # "450 cell pairs from ten different networks"
    n_recorded_cells_per_condition: 10
      # DERIVED, NOT STATED -- verify before trusting Fig. 3C/D's pair counts. Holding
      # 10 cells at each I_app level per network reproduces both of the paper's stated
      # pair counts exactly: same-condition pairs = C(10,2) = 45 per network x 10
      # networks = 450 ("an average over 450 cell pairs from ten different networks"),
      # and cross-condition (EPSP-IPSP) pairs = 10 x 10 = 100 per network x 10 networks
      # = 1000 ("except the EPSP-IPSP condition ... the number of pairs was 1000").
      # No other simple scheme reproduces both numbers. Recorded as docs/adr/0006.
    epsp_condition_nA: -1.3     # most hyperpolarising level: pushes V toward V_rev^I so
      # the trace is EPSP-dominated (Fig. 3C green). INFERRED as the extreme of the swept
      # list -- the SOM states the intent ("adjusted to isolate the EPSPs and IPSPs in
      # their respective reversal potentials") but not which level maps to which curve.
    ipsp_condition_nA: 3.7      # most depolarising level: V toward V_rev^E, so the trace
      # is IPSP-dominated (Fig. 3C red). Same inference as above.
    rest_condition_nA: 0.0      # "the black curve is from pairs at resting potential"
    ccg_bin_ms: 1.0             # sampling interval for the membrane-potential CCG. NOT
      # stated: the SOM says only "we computed cross-correlograms of the voltages" and gives
      # no bin. Declared here rather than borrowed from analysis.bin_dt_ms or
      # analysis.ccg.bin_dt_ms, both of which mean other things (the spike-train binning and
      # the in vivo spike-CCG bin), so that one quantity has exactly one setting. 1 ms is
      # far finer than the ~15 ms membrane time constant while keeping the recorded array
      # and the 2*max_lag+1 correlations tractable; the integration step is unaffected.
    ccg_max_lag_ms: 50.0        # lag range for the same CCG; the published Fig. 3C x-axis
      # spans -50 to +50 ms.
  expected:                    # reproduction targets, not inputs
    rate_excitatory_hz: 1.0
    rate_inhibitory_hz: 3.6
    mean_correlation_EE_max: 0.001

# ---------------------------------------------------------------------------
# Analysis pipeline — shared by all blocks
# Provenance: SOM S-p.24-28. See docs/paper/07-analysis-methods.md
# ---------------------------------------------------------------------------
analysis:
  bin_dt_ms: 1.0
  count_window_T_ms: 50.0
  kernel: square               # square for simulated data, gaussian for in vivo
  jitter:
    J_over_T: 4.0              # J = 4T
    n_surrogates: 500
    significance_alpha: 0.01
  ccg:
    bin_dt_ms: 5.0
    max_lag_ms: 50.0

# ---------------------------------------------------------------------------
# Qualitative sweep validation (Block 1 Phases 5-6: does c/r_out grow with p/r_in?)
# Not from the paper -- a project-specific noise-tolerance threshold for
# block1.eval.check_increasing_trend, a correlation-based proxy for "grows with x".
# ---------------------------------------------------------------------------
qualitative_checks:
  increasing_trend_min_correlation: 0.8
