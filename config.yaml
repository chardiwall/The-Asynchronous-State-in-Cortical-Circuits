# Single source of truth for every seed, path and model parameter.
# No numeric constant may be hardcoded in Python — see CLAUDE.md "Reproducibility".
#
# All model values below are transcribed from Renart et al. 2010 (see docs/paper/).
# Provenance is given per block so any value can be traced back to the SOM.

seed: 1234                     # sets random, numpy and framework RNGs at script startup

paths:
  raw: data/raw                # READ-ONLY. never written to.
  processed: data/processed
  artifacts: artifacts         # metrics, logs, figures, checkpoints

logging:
  metrics_file: artifacts/metrics.jsonl
  log_file: artifacts/run.log
  log_every_n_iterations: 1    # loss + NaN check logged every iteration

# ---------------------------------------------------------------------------
# Block 1 — feedforward postsynaptic pair (Fig. 1)
# Provenance: SOM S-p.19-20. See docs/paper/01-postsynaptic-pair.md
# ---------------------------------------------------------------------------
pair_model:
  neuron:                      # current-based LIF, V relative to rest (rest = 0)
    tau_m_ms: 10.0
    v_threshold_mV: 20.0
    v_reset_mV: 10.0
    t_refractory_ms: 2.0
  synapse:
    tau_s_ms: 5.0              # PSC decay (kick + exponential)
    epsp_peak_mV: 0.75         # defines J_E by numerical calibration
    ipsp_peak_mV: -0.75        # defines J_I by numerical calibration
  inputs:
    n_excitatory: 250
    n_inhibitory: 220          # E+I condition only
    rate_shared_sweep_hz: 5.0  # Fig. 1B
    rate_correlated_sweep_hz: 20.0   # Fig. 1C,E-F E+I condition -- see ambiguity note in docs
    rate_e_only_calibrated_hz: 4.04297   # Fig. 1E E-only curve -- resolves ambiguity 1
      # (docs/paper/01-postsynaptic-pair.md): the paper's 20Hz is E+I-only; the E-only rate
      # isn't stated, so it's calibrated by bisection (block1.calibrate_rate) to give 5Hz
      # output at r_in=0, averaging n_trials=5 independent replicates per candidate rate
      # (a code-review fix: the original single-sample-per-step version could violate
      # bisection's monotonicity assumption under simulation noise). Re-derived 2026-09-10
      # at L=20,000ms (a longer one-time calibration run, not the fast-exploratory sweep
      # scale); superseded an earlier single-sample value of 4.0708 (0.7% higher, within
      # noise but less reliably derived). PROGRESS.md records the derivation.
    mother_train:
      jitter_tau_ms: 5.0       # two-tailed exponential, zero mean
  sweeps:
    shared_fraction_p: [0.0, 0.4]    # Fig. 1B range
    shared_fraction_grid: [0.0, 0.1, 0.2, 0.3, 0.4]  # actual p sweep points (Fig. 1B, full pass)
    p_fixed: 0.2                     # Fig. 1C,E-F
    r_in: [0.0, 0.4]                 # Fig. 1E range
    r_in_grid: [0.0, 0.01, 0.025, 0.05, 0.1]  # actual r_in sweep points (Fig. 1E, full pass)
    r_in_fig1f_example: 0.025        # blue circle of Fig. 1E; Fig. 1F's traces use this point
  simulation:
    dt_ms: 0.05
    length_s: 10000.0
    chunk_duration_s: 500.0  # block1.full_pass: bounded per-chunk window for the paper-
      # accurate full pass (both input generation and simulation are chunked at this scale
      # -- see PROGRESS.md). block1.batched_model batches all 15 sweep points into one
      # simulation, so per-chunk arrays are 15x wider than the original per-point design
      # this value was first set for; kept smaller here (500s not 2000s) to keep peak RSS
      # well under the DGX's 121GB even with that wider batching.
  calibration_check:            # single-spike PSP verification harness (Phase 1 self-check),
    dt_ms: 0.01                 # distinct from the production sweep's dt/length above --
    duration_ms: 50.0           # this only needs to resolve one ~7ms-peaked PSP cleanly

# ---------------------------------------------------------------------------
# Block 2 — recurrent binary network (Fig. 2)
# Provenance: SOM S-p.18-19. See docs/paper/02-binary-network.md
# ---------------------------------------------------------------------------
binary_network:
  connection_probability: 0.2  # p_ab, all population pairs
  m_x: 0.1                     # external population mean activity
  theta: 1.0                   # firing threshold, all cells
  couplings:                   # j_ab, scaled by 1/sqrt(N) at build time (post <- pre)
    j_EE: 5.0
    j_EI: -10.0
    j_IE: 5.0
    j_II: -9.0
    j_EX: 5.0
    j_IX: 4.0
  tau_ms: 10.0                 # tau_E = tau_I = tau_X; dt = tau / (3N)
  sampling_rate_instantaneous: 1   # SR for r/c (Fig. 2C, 2G): 1 sample per tau
  sampling_rate_lagged: 16         # SR for CCGs (Fig. 2E): 16 samples per tau
  sizes_fixed: [1024, 8192]    # required exactly, not swept: Fig. 2D uses both; 2E/2G use 8192
  full_pass:                   # Fig. 2C's N-grid + per-size repeat count (session
    # 2026-09-11/12): decided against the JIT+manual-loop throughput benchmark
    # (N=1024: 612,850 ticks/s; N=8192: 83,433 ticks/s -- close to O(N^2) per-realisation
    # cost), targeting <24h wall-clock on spark-c3d8's 20 Slurm cores. Repeats taper at
    # the top of the range since cost is dominated there; paper's 50 kept everywhere it's
    # cheap. Runs as independent single-process Slurm array tasks (block2.full_pass),
    # not Python multiprocessing -- see docs/adr/0003's ARM64 ProcessPoolExecutor note.
    sizes:   [100, 178, 316, 562, 1000, 1780, 3160, 5620, 8192]
    repeats: [50,  50,  50,  50,  50,   50,   25,   12,   10]
    length_tau: 200000
  fig2g_subsample_neurons: 1000  # random E-neuron subset at N=8192 for the r histogram (~500k pairs)
  ccg:
    max_lag_ms: 50.0            # Fig. 2E; bin = tau_ms / sampling_rate_lagged (native, no downsampling)
  burn_in_tau: 10               # discarded before recording (session 2026-09-11: random
    # Bernoulli(0.5) initial state per neuron, then burn_in_tau*3N ticks discarded)
  exploratory:                  # session 2026-09-11 grilling Q11: fast validation pass,
    sizes: [100, 200, 400]      # not reproduction numbers -- checked against S-Eq(18,28-33)
    n_realisations: 5           # closed-form predictions, and used for the Q13 throughput benchmark
    length_tau: 5000
  simulation:
    length_tau: 200000
    n_realisations: 50         # Fig. 2C (pending Q13); 10 for Fig. 2F
  robustness:                  # Fig. S4 sweep
    lambda_E: [1.0, 2.0]       # scales j_EE and j_IE together
    tau_I: [1.0, 2.0]          # relative to tau_E = 1
  illustrative_panels:          # single-realisation runs for 2B/2D/2E/2G -- deliberately
    # short (not the full 200,000 tau) since these show qualitative shape, not ensemble
    # precision (2C's job already covers that); cheap enough to run locally, no DGX needed.
    panel_b_window_tau: 100      # ~1s at SR=16, one E-cell's current components
    panel_d_window_tau: 200      # ~2s at SR=16, population-mean activity (both fixed sizes)
    panel_e_window_tau: 2000     # SR=16 current-component CCGs
    panel_g_window_tau: 20000    # SR=1, 1000-neuron subsample for the r histogram

# ---------------------------------------------------------------------------
# Block 3 — recurrent conductance-based spiking network (Fig. 3)  [MAIN FOCUS]
# Provenance: SOM S-p.20-21. See docs/paper/03-recurrent-spiking-network.md
# ---------------------------------------------------------------------------
spiking_network:
  populations:
    n_excitatory: 4000
    n_inhibitory: 1000
    n_external: 4000
  connection_probability: 0.2
  neuron:
    c_m_nF: 0.25
    g_L_nS: 16.7               # tau_m = C_m/g_L = 15 ms
    v_leak_mV: -70.0
    v_threshold_mV: -50.0
    v_reset_mV: -60.0
    t_refractory_excitatory_ms: 2.0
    t_refractory_inhibitory_ms: 1.0
  reversal_potentials_mV:
    excitatory: 0.0            # V_rev^E = V_rev^X
    inhibitory: -80.0
  conductances_nS:             # mean g^ab (post <- pre)
    g_EE: 2.4
    g_EI: 40.0
    g_IE: 4.8
    g_II: 40.0
    g_EX: 5.4
    g_IX: 5.4
    heterogeneity_std_fraction: 0.5   # g ~ Gaussian(mean, 0.5*mean); see ADR on negative samples
  synapse:                     # difference of exponentials
    tau_rise_ms: 1.0
    tau_decay_ms: 5.0
    tau_normalisation_ms: 1.0  # tau-tilde: keeps unitary conductance area constant
  delays_ms:                   # uniform, sampled at 0.05 ms resolution
    from_excitatory: [0.5, 1.5]
    from_inhibitory: [0.1, 0.9]
  external_input:
    kind: poisson
    rate_hz: 2.5
  burn_in_ms: 100.0             # discarded before recording -- paper doesn't state one
    # (docs/paper/03 Ambiguity); ~7x tau_m=15ms, long enough for the initial transient
    # to settle. Revisit with real numbers before the Fig. 3A-B full pass.
  simulation:
    integrator: rk2            # second-order Runge-Kutta
    dt_ms: 0.05
    length_s: 200.0            # 5000 s for the Fig. S6 characterisation run
    n_networks: 10
  r_bar_sample_size: 1000       # session 2026-09-16/17 grilling: r_bar estimated over all
    # pairs among this many randomly-sampled E neurons, mirroring Fig. S6's own "1000 E and
    # 1000 I cells" convention -- not all N_E pairs (~8M, too many) and not an ad hoc sample.
  exploratory:                 # session 2026-09-14 grilling Q1: smoke-test pass, full
    # paper-scale N (unlike block 2 -- g^ab are fixed nS, not 1/sqrt(N)-scaled, so
    # shrinking N would starve every neuron of input and land in a different regime).
    # Only length_s is shortened relative to `simulation` above; everything else is
    # identical, so this run is a true subset of the eventual full pass.
    length_s: 5.0
    n_networks: 1
    brian2_device: runtime      # standalone deferred until a measured need (ADR 0001/0003 pattern)
  expected:                    # reproduction targets, not inputs
    rate_excitatory_hz: 1.0
    rate_inhibitory_hz: 3.6
    mean_correlation_EE_max: 0.001

# ---------------------------------------------------------------------------
# Analysis pipeline — shared by all blocks
# Provenance: SOM S-p.24-28. See docs/paper/07-analysis-methods.md
# ---------------------------------------------------------------------------
analysis:
  bin_dt_ms: 1.0
  count_window_T_ms: 50.0
  kernel: square               # square for simulated data, gaussian for in vivo
  jitter:
    J_over_T: 4.0              # J = 4T
    n_surrogates: 500
    significance_alpha: 0.01
  ccg:
    bin_dt_ms: 5.0
    max_lag_ms: 50.0

# ---------------------------------------------------------------------------
# Qualitative sweep validation (Block 1 Phases 5-6: does c/r_out grow with p/r_in?)
# Not from the paper -- a project-specific noise-tolerance threshold for
# block1.eval.check_increasing_trend, a correlation-based proxy for "grows with x".
# ---------------------------------------------------------------------------
qualitative_checks:
  increasing_trend_min_correlation: 0.8
